name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip extension
        run: |
          zip -r goi-utils.zip manifest.json content.js

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: goi-utils.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
